; Scan3D turntable: ESP32-S3-DevKitC-1 (WROOM) driving a 28BYJ-48 through a ULN2003 board.
; pioarduino platform 55.03.312 (Arduino core 3.3): build with the pioarduino IDE or ~/.pioarduino/penv/Scripts/pio.

[env:turntable]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
